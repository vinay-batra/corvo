name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Syntax-check the backend
        run: python -m py_compile main.py
      - name: Run pure-logic tests
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time only. lib/api.ts throws if NEXT_PUBLIC_API_URL is unset under
      # NODE_ENV=production (which `next build` is), and the Supabase browser
      # client needs its public vars defined. These are public, client-exposed
      # values; the anon key here is a harmless build placeholder (the real one
      # is injected by Vercel at deploy and is public anyway). No secrets in CI.
      NEXT_PUBLIC_API_URL: https://web-production-7a78d.up.railway.app
      NEXT_PUBLIC_SUPABASE_URL: https://bkdjillyzyyysmkpvnos.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Requires `vitest` as a devDependency and a `"test": "vitest run"` script
      # in frontend/package.json (see frontend/lib/anchorValue.test.ts). Once
      # added, this runs the unit tests; npx resolves the local binary.
      - name: Run unit tests
        run: npx vitest run
      - name: Production build (also type-checks)
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
